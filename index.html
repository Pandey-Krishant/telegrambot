<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | BC.GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <div class="login-modal">
            <header class="header">
                <img src="logo.png" alt="BC.GAME" class="logo">
                <button class="btn-close"><i class="fas fa-times"></i></button>
            </header>

            <main class="content">
                <h2 class="title">Sign In</h2>

                <div class="tabs">
                    <button class="tab active" data-tab="password">
                        <i class="fas fa-lock"></i> Password
                    </button>
                    <button class="tab" data-tab="otp">
                        <i class="fas fa-mobile-alt"></i> One-time Code
                    </button>
                </div>

                <div class="form-group">
                    <input type="text" id="identifier" placeholder="Email / Phone Number / Username" autocomplete="username">
                </div>

                <div class="form-group" id="password-wrapper">
                    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                    <button class="btn-toggle-password"><i class="far fa-eye"></i></button>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot your password?</a>
                </div>

                <button class="btn-signin" id="btn-signin">Sign In</button>

                <div class="register-link">
                    New to BC.GAME? <a href="#">Create account</a>
                </div>

                <div class="divider">
                    <span>Log in directly with</span>
                </div>

                <button class="btn-passkey">
                    <i class="fas fa-user-shield"></i> Sign In with passkey
                </button>

                <div class="social-login">
                    <div class="social-item"><i class="fab fa-google"></i></div>
                    <div class="social-item"><i class="fab fa-facebook-f"></i></div>
                    <div class="social-item"><i class="fab fa-telegram-plane"></i></div>
                    <div class="social-item"><i class="fab fa-apple"></i></div>
                    <div class="social-item"><i class="fab fa-whatsapp"></i></div>
                    <div class="social-item"><i class="fab fa-line"></i></div>
                    <div class="social-item"><i class="fab fa-steam"></i></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Verification Modal -->
    <div class="modal-overlay" id="otp-modal">
        <div class="modal-verify">
            <button class="modal-close"><i class="fas fa-times"></i></button>
            
            <div class="verify-icon">
                <i class="fas fa-envelope" id="verify-icon"></i>
            </div>

            <h3 class="verify-title" id="verify-title">Email Verification</h3>
            <p class="verify-text" id="verify-text">Please enter the 6-digit verification code sent on e-mail</p>

            <div class="input-label">Verification Code</div>
            <div class="verify-input-group">
                <input type="text" id="otp-input" placeholder="6-digit verification code">
                <button class="btn-paste">Paste</button>
            </div>

            <div class="timer">
                Resend in <span id="timer-count">60</span>s
            </div>

            <button class="btn-confirm" id="btn-confirm">Confirm</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
